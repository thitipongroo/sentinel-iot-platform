# ──────────────────────────────────────────────────────────────────────────────
# Sentinel IoT Platform — Docker Compose
#
# Profiles:
#   (no profile / default)  — core stack: postgres, redis, mosquitto, kafka, backend, frontend, simulator
#   observability            — adds Prometheus, Grafana, Jaeger
#   full                     — core + observability (equivalent to running both)
#
# Usage:
#   docker compose up                                  # core only (fast onboarding)
#   docker compose --profile observability up          # core + monitoring
#   docker compose --profile full up                   # everything
# ──────────────────────────────────────────────────────────────────────────────
networks:
  sentinel-net:
    driver: bridge

volumes:
  postgres_data:
  redis_data:
  mosquitto_data:
  kafka_data:
  prometheus_data:
  grafana_data:
  jaeger_data:

services:
  # ─── Infrastructure ────────────────────────────────────────────────────────

  postgres:
    image: postgres:16-alpine
    container_name: sentinel-postgres
    environment:
      POSTGRES_DB: sentinel
      POSTGRES_USER: sentinel
      POSTGRES_PASSWORD: sentinel
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    networks: [sentinel-net]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U sentinel"]
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: sentinel-redis
    command: >
      redis-server
      --appendonly yes
      --appendfsync always
      --maxmemory-policy noeviction
      --save 60 1000
    volumes:
      - redis_data:/data
    ports:
      - "6379:6379"
    networks: [sentinel-net]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 3s
      retries: 5

  mosquitto:
    image: eclipse-mosquitto:2.0
    container_name: sentinel-mqtt
    entrypoint: ["/bin/sh", "/mosquitto/config/docker-entrypoint.sh"]
    environment:
      MQTT_USER: ${MQTT_USER:-sentinel-backend}
      MQTT_PASS: ${MQTT_PASS:-changeme}
      MQTT_DEVICE_USER: ${MQTT_DEVICE_USER:-sentinel-device}
      MQTT_DEVICE_PASS: ${MQTT_DEVICE_PASS:-changeme}
      # Per-device credentials: each device gets its own MQTT account (no shared identity).
      # Format: "device-id-1:password1,device-id-2:password2"
      # Production: derive passwords from device secrets via HMAC-SHA256(deviceId, MQTT_DEVICE_SECRET).
      MQTT_DEVICE_CREDENTIALS: ${MQTT_DEVICE_CREDENTIALS:-sensor-1:dev-pass-1,sensor-2:dev-pass-2,sensor-3:dev-pass-3}
      # TLS enforcement: set to "true" after running scripts/gen-mqtt-certs.sh.
      # When true, the broker refuses to start without certs and removes the plaintext listener.
      MQTT_TLS_REQUIRED: ${MQTT_TLS_REQUIRED:-false}
      # mTLS: set to "true" to require clients to present a valid certificate.
      # Requires gen-mqtt-certs.sh --with-client-certs and mounting client certs into services.
      MQTT_MTLS_ENABLED: ${MQTT_MTLS_ENABLED:-false}
    volumes:
      - ./mosquitto/mosquitto.conf:/mosquitto/config/mosquitto.conf:ro
      - ./mosquitto/acl:/mosquitto/config/acl:ro
      - ./mosquitto/docker-entrypoint.sh:/mosquitto/config/docker-entrypoint.sh:ro
      - ./mosquitto/certs:/mosquitto/certs:ro
      - mosquitto_data:/mosquitto/data
    ports:
      - "1883:1883"
      - "8883:8883"
      - "9001:9001"
    networks: [sentinel-net]
    healthcheck:
      test: ["CMD-SHELL", "mosquitto_pub -t sentinel/health -m ping -q 0 -u \"$$MQTT_USER\" -P \"$$MQTT_PASS\" || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5

  kafka:
    image: apache/kafka:3.7.0
    container_name: sentinel-kafka
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_LISTENERS: PLAINTEXT://0.0.0.0:9092,CONTROLLER://0.0.0.0:9093
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:9092
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: PLAINTEXT:PLAINTEXT,CONTROLLER:PLAINTEXT
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "false"   # topics created by KafkaConfig bean on startup
      KAFKA_LOG_DIRS: /var/lib/kafka/data
      CLUSTER_ID: MkU3OEVBNTcwNTJENDM2Qk       # stable KRaft cluster ID (base64, 22 chars)
    volumes:
      - kafka_data:/var/lib/kafka/data
    ports:
      - "9092:9092"
    networks: [sentinel-net]
    healthcheck:
      test: ["CMD-SHELL", "/opt/kafka/bin/kafka-topics.sh --bootstrap-server localhost:9092 --list || exit 1"]
      interval: 15s
      timeout: 10s
      retries: 10
      start_period: 30s

  # ─── Application ───────────────────────────────────────────────────────────

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: sentinel-backend
    environment:
      DB_HOST: postgres
      DB_NAME: sentinel
      DB_USER: sentinel
      DB_PASSWORD: sentinel
      REDIS_HOST: redis
      # Use ssl://mosquitto:8883 after enabling TLS (MQTT_TLS_REQUIRED=true).
      MQTT_BROKER: ${MQTT_BROKER:-tcp://mosquitto:1883}
      MQTT_USER: ${MQTT_USER:-sentinel-backend}
      MQTT_PASS: ${MQTT_PASS:-changeme}
      JWT_SECRET: ${JWT_SECRET}
      LINE_NOTIFY_TOKEN: ${LINE_NOTIFY_TOKEN:-}
      LINE_NOTIFY_ENABLED: ${LINE_NOTIFY_ENABLED:-false}
      TEMP_THRESHOLD: ${TEMP_THRESHOLD:-80}
      SMOKE_THRESHOLD: ${SMOKE_THRESHOLD:-200}
      KAFKA_BOOTSTRAP_SERVERS: kafka:9092
      SPRING_APPLICATION_NAME: sentinel-iot-platform
      TRACING_ENABLED: ${TRACING_ENABLED:-false}
      OTEL_EXPORTER_OTLP_ENDPOINT: http://jaeger:4318/v1/traces
      SPRING_PROFILES_ACTIVE: prod
    ports:
      - "8080:8080"
    networks: [sentinel-net]
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      mosquitto:
        condition: service_healthy
      kafka:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:8080/actuator/health || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 5

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: sentinel-frontend
    environment:
      # Server-side: Next.js rewrites proxy /api/* to this URL
      BACKEND_URL: http://backend:8080
      # Client-side: browser connects WebSocket directly to backend
      NEXT_PUBLIC_WS_URL: ws://localhost:8080/ws/telemetry
    ports:
      - "3000:3000"
    networks: [sentinel-net]
    depends_on:
      backend:
        condition: service_healthy

  simulator:
    build:
      context: ./simulator
      dockerfile: Dockerfile
    container_name: sentinel-simulator
    environment:
      MQTT_BROKER: ${SIMULATOR_MQTT_BROKER:-mqtt://mosquitto:1883}
      MQTT_TOPIC: factory/telemetry
      MQTT_USER: ${MQTT_DEVICE_USER:-sentinel-device}
      MQTT_PASS: ${MQTT_DEVICE_PASS:-changeme}
      INTERVAL_MS: ${SIMULATOR_INTERVAL:-5000}
      DEVICES: ${SIMULATOR_DEVICES:-sensor-1,sensor-2,sensor-3}
    networks: [sentinel-net]
    depends_on:
      mosquitto:
        condition: service_healthy
      backend:
        condition: service_healthy
    restart: unless-stopped

  # ─── Tracing (profile: observability | full) ────────────────────────────────

  jaeger:
    image: jaegertracing/all-in-one:1.57
    container_name: sentinel-jaeger
    profiles: [observability, full]
    user: root
    environment:
      COLLECTOR_OTLP_ENABLED: "true"
      SPAN_STORAGE_TYPE: badger
      BADGER_EPHEMERAL: "false"
      BADGER_DIRECTORY_VALUE: /badger/data
      BADGER_DIRECTORY_KEY: /badger/key
    volumes:
      - jaeger_data:/badger
    ports:
      - "16686:16686"   # Jaeger UI
      - "4318:4318"     # OTLP HTTP receiver
    networks: [sentinel-net]
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:14269/metrics || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 5

  # ─── Monitoring (profile: observability | full) ─────────────────────────────

  prometheus:
    image: prom/prometheus:v2.52.0
    container_name: sentinel-prometheus
    profiles: [observability, full]
    volumes:
      - ./monitoring/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus_data:/prometheus
    command:
      - --config.file=/etc/prometheus/prometheus.yml
      - --storage.tsdb.retention.time=15d
    ports:
      - "9090:9090"
    networks: [sentinel-net]

  grafana:
    image: grafana/grafana:10.4.3
    container_name: sentinel-grafana
    profiles: [observability, full]
    environment:
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_PASSWORD:-changeme}
      GF_USERS_ALLOW_SIGN_UP: "false"
    volumes:
      - grafana_data:/var/lib/grafana
      - ./monitoring/grafana/provisioning:/etc/grafana/provisioning:ro
    ports:
      - "3001:3000"
    networks: [sentinel-net]
    depends_on: [prometheus]

# ExternalSecret pulls credentials from AWS Secrets Manager via the
# External Secrets Operator (https://external-secrets.io).
# Rendered only when ESO is the secret management strategy (default for production).
#
# In local/dev: create the K8s Secret manually or via:
#   kubectl create secret generic sentinel-secrets \
#     --from-literal=JWT_SECRET=... \
#     --from-literal=DB_PASSWORD=... \
#     --from-literal=REDIS_PASSWORD=... \
#     --from-literal=MQTT_PASS=... \
#     --from-literal=MQTT_DEVICE_PASS=...
apiVersion: external-secrets.io/v1beta1
kind: ExternalSecret
metadata:
  name: {{ include "sentinel-iot.fullname" . }}-external-secret
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "sentinel-iot.labels" . | nindent 4 }}
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: aws-secrets-manager
    kind: ClusterSecretStore
  target:
    name: {{ .Values.backend.secretName }}
    creationPolicy: Owner
  data:
    - secretKey: JWT_SECRET
      remoteRef:
        key: sentinel/{{ .Release.Namespace }}/secrets
        property: jwt_secret
    - secretKey: DB_USER
      remoteRef:
        key: sentinel/{{ .Release.Namespace }}/secrets
        property: db_username
    - secretKey: DB_PASSWORD
      remoteRef:
        key: sentinel/{{ .Release.Namespace }}/secrets
        property: db_password
    - secretKey: REDIS_PASSWORD
      remoteRef:
        key: sentinel/{{ .Release.Namespace }}/secrets
        property: redis_password
    - secretKey: MQTT_USER
      remoteRef:
        key: sentinel/{{ .Release.Namespace }}/secrets
        property: mqtt_user
    - secretKey: MQTT_PASS
      remoteRef:
        key: sentinel/{{ .Release.Namespace }}/secrets
        property: mqtt_pass
    - secretKey: MQTT_DEVICE_USER
      remoteRef:
        key: sentinel/{{ .Release.Namespace }}/secrets
        property: mqtt_device_user
    - secretKey: MQTT_DEVICE_PASS
      remoteRef:
        key: sentinel/{{ .Release.Namespace }}/secrets
        property: mqtt_device_pass
    - secretKey: LINE_MESSAGING_CHANNEL_TOKEN
      remoteRef:
        key: sentinel/{{ .Release.Namespace }}/secrets
        property: line_messaging_channel_token
    - secretKey: LINE_MESSAGING_TO
      remoteRef:
        key: sentinel/{{ .Release.Namespace }}/secrets
        property: line_messaging_to
    - secretKey: TELEGRAM_BOT_TOKEN
      remoteRef:
        key: sentinel/{{ .Release.Namespace }}/secrets
        property: telegram_bot_token
    - secretKey: TELEGRAM_CHAT_ID
      remoteRef:
        key: sentinel/{{ .Release.Namespace }}/secrets
        property: telegram_chat_id

apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "sentinel-iot.fullname" . }}-config
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "sentinel-iot.labels" . | nindent 4 }}
data:
  # ── Database ────────────────────────────────────────────────────────────────
  DB_HOST: {{ include "sentinel-iot.dbHost" . | quote }}
  DB_PORT: {{ .Values.externalPostgres.port | default "5432" | quote }}
  DB_NAME: {{ .Values.externalPostgres.database | default "sentinel" | quote }}

  # ── Redis ────────────────────────────────────────────────────────────────────
  REDIS_HOST: {{ include "sentinel-iot.redisHost" . | quote }}
  REDIS_PORT: {{ .Values.externalRedis.port | default "6379" | quote }}

  # ── Kafka ────────────────────────────────────────────────────────────────────
  KAFKA_BOOTSTRAP_SERVERS: {{ include "sentinel-iot.kafkaBootstrap" . | quote }}

  # ── MQTT ─────────────────────────────────────────────────────────────────────
  MQTT_BROKER: {{ printf "tcp://%s-mosquitto:1883" (include "sentinel-iot.fullname" .) | quote }}

  # ── Application ──────────────────────────────────────────────────────────────
  SPRING_PROFILES_ACTIVE: {{ .Values.backend.env.springProfilesActive | quote }}
  CORS_ALLOWED_ORIGINS: {{ .Values.backend.env.corsAllowedOrigins | quote }}
  TEMP_THRESHOLD: {{ .Values.backend.env.tempThreshold | quote }}
  SMOKE_THRESHOLD: {{ .Values.backend.env.smokeThreshold | quote }}
  SPRING_APPLICATION_NAME: sentinel-iot-platform
  OTEL_EXPORTER_OTLP_ENDPOINT: {{ printf "http://%s-jaeger:4318/v1/traces" (include "sentinel-iot.fullname" .) | quote }}

  # ── Frontend ──────────────────────────────────────────────────────────────────
  BACKEND_URL: {{ .Values.frontend.env.backendUrl | quote }}
  NEXT_PUBLIC_WS_URL: {{ .Values.frontend.env.nextPublicWsUrl | quote }}

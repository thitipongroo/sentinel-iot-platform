{{- if .Values.rollout.enabled }}
{{- $fullname := include "sentinel-iot.fullname" . }}
apiVersion: argoproj.io/v1alpha1
kind: Rollout
metadata:
  name: {{ $fullname }}-backend
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "sentinel-iot.labels" . | nindent 4 }}
    app.kubernetes.io/component: backend
spec:
  {{- if not .Values.keda.enabled }}
  replicas: {{ .Values.backend.replicaCount }}
  {{- end }}
  selector:
    matchLabels:
      {{- include "sentinel-iot.selectorLabels" . | nindent 6 }}
      app.kubernetes.io/component: backend
  revisionHistoryLimit: 3

  {{- if eq .Values.rollout.strategy "blueGreen" }}
  strategy:
    blueGreen:
      activeService: {{ $fullname }}-backend
      previewService: {{ $fullname }}-backend-preview
      autoPromotionEnabled: {{ .Values.rollout.blueGreen.autoPromotionEnabled }}
      scaleDownDelaySeconds: {{ .Values.rollout.blueGreen.scaleDownDelaySeconds }}
      {{- if .Values.rollout.blueGreen.prePromotionAnalysis.enabled }}
      prePromotionAnalysis:
        templates:
          - templateName: {{ $fullname }}-backend-health
        args:
          - name: service-name
            value: {{ $fullname }}-backend-preview
      {{- end }}
      postPromotionAnalysis:
        templates:
          - templateName: {{ $fullname }}-backend-health
        args:
          - name: service-name
            value: {{ $fullname }}-backend
  {{- else }}
  strategy:
    canary:
      canaryService: {{ $fullname }}-backend-preview
      stableService: {{ $fullname }}-backend
      steps:
        {{- toYaml .Values.rollout.canary.steps | nindent 8 }}
      analysis:
        templates:
          - templateName: {{ $fullname }}-backend-health
        startingStep: 2
  {{- end }}

  template:
    metadata:
      labels:
        {{- include "sentinel-iot.selectorLabels" . | nindent 8 }}
        app.kubernetes.io/component: backend
      annotations:
        checksum/config: {{ include (print $.Template.BasePath "/configmap.yaml") . | sha256sum }}
    spec:
      topologySpreadConstraints:
        - maxSkew: 1
          topologyKey: topology.kubernetes.io/zone
          whenUnsatisfiable: ScheduleAnyway
          labelSelector:
            matchLabels:
              app.kubernetes.io/component: backend
        - maxSkew: 1
          topologyKey: kubernetes.io/hostname
          whenUnsatisfiable: DoNotSchedule
          labelSelector:
            matchLabels:
              app.kubernetes.io/component: backend
      affinity:
        podAntiAffinity:
          preferredDuringSchedulingIgnoredDuringExecution:
            - weight: 100
              podAffinityTerm:
                topologyKey: kubernetes.io/hostname
                labelSelector:
                  matchLabels:
                    app.kubernetes.io/component: backend
      terminationGracePeriodSeconds: 60
      containers:
        - name: backend
          image: {{ include "sentinel-iot.image" (dict "registry" .Values.global.imageRegistry "repo" .Values.backend.image.repository "tag" .Values.backend.image.tag) }}
          imagePullPolicy: {{ .Values.backend.image.pullPolicy }}
          ports:
            - name: http
              containerPort: 8080
              protocol: TCP
          envFrom:
            - configMapRef:
                name: {{ $fullname }}-config
          env:
            - name: JWT_SECRET
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.backend.secretName }}
                  key: JWT_SECRET
            - name: DB_USER
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.backend.secretName }}
                  key: DB_USER
            - name: DB_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.backend.secretName }}
                  key: DB_PASSWORD
            - name: REDIS_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.backend.secretName }}
                  key: REDIS_PASSWORD
                  optional: true
            - name: MQTT_USER
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.backend.secretName }}
                  key: MQTT_USER
            - name: MQTT_PASS
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.backend.secretName }}
                  key: MQTT_PASS
            - name: LINE_MESSAGING_CHANNEL_TOKEN
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.backend.secretName }}
                  key: LINE_MESSAGING_CHANNEL_TOKEN
                  optional: true
            - name: LINE_MESSAGING_TO
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.backend.secretName }}
                  key: LINE_MESSAGING_TO
                  optional: true
            - name: TELEGRAM_BOT_TOKEN
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.backend.secretName }}
                  key: TELEGRAM_BOT_TOKEN
                  optional: true
            - name: TELEGRAM_CHAT_ID
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.backend.secretName }}
                  key: TELEGRAM_CHAT_ID
                  optional: true
          startupProbe:
            httpGet:
              path: /actuator/health/liveness
              port: http
            failureThreshold: 18
            periodSeconds: 10
            initialDelaySeconds: 20
          livenessProbe:
            httpGet:
              path: /actuator/health/liveness
              port: http
            periodSeconds: 15
            failureThreshold: 3
            timeoutSeconds: 5
          readinessProbe:
            httpGet:
              path: /actuator/health/readiness
              port: http
            periodSeconds: 10
            failureThreshold: 3
            timeoutSeconds: 5
          resources:
            {{- toYaml .Values.backend.resources | nindent 12 }}
          securityContext:
            runAsNonRoot: true
            runAsUser: 1000
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: false
            capabilities:
              drop: [ALL]
      securityContext:
        fsGroup: 1000
      {{- with .Values.global.imagePullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
---
# Preview service: receives canary/blue traffic before promotion
apiVersion: v1
kind: Service
metadata:
  name: {{ $fullname }}-backend-preview
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "sentinel-iot.labels" . | nindent 4 }}
    app.kubernetes.io/component: backend
    sentinel-iot.io/slot: preview
spec:
  type: ClusterIP
  selector:
    {{- include "sentinel-iot.selectorLabels" . | nindent 4 }}
    app.kubernetes.io/component: backend
  ports:
    - name: http
      port: 8080
      targetPort: http
      protocol: TCP
{{- end }}

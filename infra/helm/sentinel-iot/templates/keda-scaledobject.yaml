{{- if .Values.keda.enabled }}
apiVersion: keda.sh/v1alpha1
kind: TriggerAuthentication
metadata:
  name: {{ include "sentinel-iot.fullname" . }}-keda-kafka-auth
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "sentinel-iot.labels" . | nindent 4 }}
spec:
  # SASL/PLAINTEXT for MSK; empty for in-cluster Kafka (no auth)
  secretTargetRef: []
---
{{- if and .Values.keda.enabled .Values.keda.redis (and .Values.keda.redis.enabled .Values.keda.redis.enableAuth) }}
---
apiVersion: keda.sh/v1alpha1
kind: TriggerAuthentication
metadata:
  name: {{ include "sentinel-iot.fullname" . }}-keda-redis-auth
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "sentinel-iot.labels" . | nindent 4 }}
spec:
  secretTargetRef:
    - parameter: password
      name: {{ .Values.backend.secretName }}
      key: REDIS_PASSWORD
{{- end }}
---
apiVersion: keda.sh/v1alpha1
kind: ScaledObject
metadata:
  name: {{ include "sentinel-iot.fullname" . }}-backend
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "sentinel-iot.labels" . | nindent 4 }}
    app.kubernetes.io/component: backend
spec:
  scaleTargetRef:
    {{- if .Values.rollout.enabled }}
    apiVersion: argoproj.io/v1alpha1
    kind: Rollout
    {{- else }}
    apiVersion: apps/v1
    kind: Deployment
    {{- end }}
    name: {{ include "sentinel-iot.fullname" . }}-backend

  minReplicaCount: {{ .Values.keda.minReplicaCount }}
  maxReplicaCount: {{ .Values.keda.maxReplicaCount }}

  # KEDA checks every 15s; cooldown 5 min before scale-down to avoid flapping
  pollingInterval: 15
  cooldownPeriod: 300

  triggers:
    # ── Trigger 1: Kafka Consumer Group Lag (sentinel-telemetry-ingest) ────────
    - type: kafka
      metadata:
        bootstrapServers: {{ include "sentinel-iot.kafkaBootstrap" . | quote }}
        consumerGroup: {{ .Values.keda.consumerGroup }}
        topic: {{ .Values.keda.kafkaTopic }}
        # Number of messages per partition that triggers +1 replica
        lagThreshold: {{ .Values.keda.lagThreshold | quote }}
        # Don't scale to 0 unless lag drops below activationLagThreshold
        activationLagThreshold: {{ .Values.keda.activationLagThreshold | quote }}
        offsetResetPolicy: latest

    # ── Trigger 2: Redis Replay Queue Depth (sentinel:replay:queue) ────────────
    {{- if and .Values.keda.redis .Values.keda.redis.enabled }}
    - type: redis
      metadata:
        address: {{ printf "%s:%s" (include "sentinel-iot.redisHost" .) (.Values.externalRedis.port | default "6379") | quote }}
        listName: {{ .Values.keda.redis.listName | default "sentinel:replay:queue" | quote }}
        listLength: {{ .Values.keda.redis.listLength | default "200" | quote }}
        activationListLength: {{ .Values.keda.redis.activationListLength | default "10" | quote }}
      {{- if .Values.keda.redis.enableAuth }}
      authenticationRef:
        name: {{ include "sentinel-iot.fullname" . }}-keda-redis-auth
      {{- end }}
    {{- end }}
{{- end }}

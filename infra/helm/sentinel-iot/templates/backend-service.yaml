apiVersion: v1
kind: Service
metadata:
  name: {{ include "sentinel-iot.fullname" . }}-backend
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "sentinel-iot.labels" . | nindent 4 }}
    app.kubernetes.io/component: backend
spec:
  type: ClusterIP
  selector:
    {{- include "sentinel-iot.selectorLabels" . | nindent 4 }}
    app.kubernetes.io/component: backend
  ports:
    - name: http
      port: 8080
      targetPort: http
      protocol: TCP

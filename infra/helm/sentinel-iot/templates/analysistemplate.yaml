{{- if .Values.rollout.enabled }}
{{- $promAddr := .Values.rollout.analysis.prometheusAddress | default "http://prometheus-operated.monitoring.svc:9090" }}
apiVersion: argoproj.io/v1alpha1
kind: AnalysisTemplate
metadata:
  name: {{ include "sentinel-iot.fullname" . }}-backend-health
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "sentinel-iot.labels" . | nindent 4 }}
spec:
  args:
    - name: service-name

  metrics:
    # ── HTTP 5xx error rate < 0.1% (RFC-001 SLO threshold) ─────────────────────
    - name: error-rate
      interval: 30s
      count: 5
      successCondition: result[0] <= {{ .Values.rollout.analysis.maxErrorRate | default 0.001 }}
      failureLimit: 2
      provider:
        prometheus:
          address: {{ $promAddr | quote }}
          query: |
            (sum(rate(http_server_requests_seconds_count{
              service="{{ `{{args.service-name}}` }}",
              status=~"5.."
            }[2m])) or vector(0))
            /
            (sum(rate(http_server_requests_seconds_count{
              service="{{ `{{args.service-name}}` }}"
            }[2m])) > 0 or vector(1))

    # ── P95 request latency < 200ms (RFC-001 SLO threshold) ────────────────────
    - name: p95-latency
      interval: 30s
      count: 5
      successCondition: result[0] <= {{ .Values.rollout.analysis.maxP95LatencySeconds | default 0.2 }}
      failureLimit: 2
      provider:
        prometheus:
          address: {{ $promAddr | quote }}
          query: |
            histogram_quantile(0.95,
              sum(rate(http_server_requests_seconds_bucket{
                service="{{ `{{args.service-name}}` }}"
              }[2m])) by (le)
            )

    # ── JVM heap usage < 85% ───────────────────────────────────────────────────
    - name: jvm-heap-usage
      interval: 60s
      count: 3
      successCondition: result[0] < {{ .Values.rollout.analysis.maxJvmHeapPercent | default 0.85 }}
      failureLimit: 1
      provider:
        prometheus:
          address: {{ $promAddr | quote }}
          query: |
            sum(jvm_memory_used_bytes{
              service="{{ `{{args.service-name}}` }}",
              area="heap"
            })
            /
            sum(jvm_memory_max_bytes{
              service="{{ `{{args.service-name}}` }}",
              area="heap"
            })

    # ── Readiness probe: Spring Boot Actuator must respond with status UP ──────
    - name: readiness-check
      interval: 15s
      count: 4
      successCondition: result == "UP"
      failureLimit: 2
      provider:
        web:
          url: "http://{{ `{{args.service-name}}` }}.{{ .Release.Namespace }}.svc:8080/actuator/health/readiness"
          jsonPath: "{$.status}"
{{- end }}

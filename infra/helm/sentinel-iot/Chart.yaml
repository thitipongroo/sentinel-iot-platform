apiVersion: v2
name: sentinel-iot
description: Production-grade Industrial IoT Monitoring Platform
type: application
version: 1.0.0
appVersion: "1.0.0"
keywords:
  - iot
  - mqtt
  - kafka
  - telemetry
  - monitoring
maintainers:
  - name: sentinel-team
home: https://github.com/yourorg/sentinel-iot-platform
sources:
  - https://github.com/yourorg/sentinel-iot-platform

# ── External chart dependency versions (locked) ──────────────────────────────
# Pin exact chart versions here. Bump intentionally and test in staging first.
# Run `helm dependency update` after changing this section.
dependencies:
  - name: argo-rollouts
    repository: https://argoproj.github.io/argo-helm
    version: "2.37.3"
    condition: rollouts.enabled
  - name: keda
    repository: https://kedacore.github.io/charts
    version: "2.14.2"
    condition: keda.enabled

# ── Global ────────────────────────────────────────────────────────────────────
global:
  imageRegistry: "ghcr.io/yourorg"
  imagePullSecrets: []

nameOverride: ""
fullnameOverride: ""

# ── Backend (Spring Boot) ─────────────────────────────────────────────────────
backend:
  image:
    repository: sentinel-backend
    tag: latest
    pullPolicy: IfNotPresent
  replicaCount: 2
  resources:
    requests:
      cpu: 500m
      memory: 512Mi
    limits:
      cpu: 1000m
      memory: 1Gi
  autoscaling:
    enabled: true
    minReplicas: 2
    maxReplicas: 10
    targetCPUUtilizationPercentage: 70
    targetMemoryUtilizationPercentage: 80
  env:
    jwtExpirationMs: "900000"
    refreshExpirationMs: "604800000"
    tempThreshold: "80"
    smokeThreshold: "200"
    corsAllowedOrigins: "https://sentinel.example.com"
    springProfilesActive: "prod"
  # Secret keys referenced from the ExternalSecret-provisioned K8s Secret
  secretName: sentinel-secrets

# ── Frontend (Next.js) ───────────────────────────────────────────────────────
frontend:
  image:
    repository: sentinel-frontend
    tag: latest
    pullPolicy: IfNotPresent
  replicaCount: 2
  resources:
    requests:
      cpu: 200m
      memory: 256Mi
    limits:
      cpu: 500m
      memory: 512Mi
  env:
    backendUrl: "http://sentinel-backend:8080"
    nextPublicWsUrl: "wss://sentinel.example.com/ws/telemetry"

# ── PostgreSQL (in-cluster dev; disabled in prod — use RDS) ──────────────────
postgres:
  enabled: true
  # ha: true → uses CloudNativePG Cluster (1 primary + 1 replica, auto-failover)
  # ha: false → uses the simple single-instance StatefulSet
  ha: false
  image:
    repository: postgres
    tag: "16-alpine"
  resources:
    requests:
      cpu: 250m
      memory: 256Mi
    limits:
      cpu: 500m
      memory: 512Mi
  persistence:
    size: 10Gi
    storageClass: ""   # uses cluster default; set to "gp3" on EKS
  credentials:
    database: sentinel
    username: sentinel
    # password comes from sentinel-secrets

# External PostgreSQL (used when postgres.enabled=false)
externalPostgres:
  host: ""
  port: "5432"
  database: sentinel

# ── Redis (in-cluster dev; disabled in prod — use ElastiCache) ───────────────
redis:
  enabled: true
  image:
    repository: redis
    tag: "7-alpine"
  resources:
    requests:
      cpu: 100m
      memory: 128Mi
    limits:
      cpu: 250m
      memory: 256Mi
  persistence:
    size: 2Gi
    storageClass: ""

externalRedis:
  host: ""
  port: "6379"

# ── Kafka (in-cluster dev; disabled in prod — use MSK) ───────────────────────
kafka:
  enabled: true
  image:
    repository: apache/kafka
    tag: "3.7.0"
  resources:
    requests:
      cpu: 500m
      memory: 1Gi
    limits:
      cpu: 1000m
      memory: 2Gi
  persistence:
    size: 20Gi
    storageClass: ""
  clusterId: "MkU3OEVBNTcwNTJENDM2Qk"   # stable KRaft cluster ID

externalKafka:
  bootstrapServers: ""

# ── Mosquitto MQTT ───────────────────────────────────────────────────────────
mosquitto:
  enabled: true
  image:
    repository: eclipse-mosquitto
    tag: "2.0"
  resources:
    requests:
      cpu: 100m
      memory: 64Mi
    limits:
      cpu: 250m
      memory: 128Mi

# ── Ingress ──────────────────────────────────────────────────────────────────
ingress:
  enabled: true
  className: nginx
  host: sentinel.example.com
  tls:
    enabled: true
    secretName: sentinel-tls
  annotations:
    cert-manager.io/cluster-issuer: letsencrypt-prod

# ── PodDisruptionBudget ───────────────────────────────────────────────────────
pdb:
  backend:
    minAvailable: 1
  frontend:
    minAvailable: 1

# ── Argo Rollouts — Blue/Green & Canary ──────────────────────────────────────
# When enabled=true, backend-rollout.yaml is used instead of backend-deployment.yaml.
rollout:
  enabled: false
  strategy: blueGreen     # blueGreen | canary

  blueGreen:
    # false = require manual `kubectl argo rollouts promote` before cutover
    autoPromotionEnabled: false
    # Seconds to keep old (blue) ReplicaSet around after promotion so HAProxy/nginx drains
    scaleDownDelaySeconds: 60
    # Run analysis against preview stack before allowing promotion
    prePromotionAnalysis:
      enabled: true

  canary:
    steps:
      - setWeight: 10
      - pause:
          duration: 2m
      - setWeight: 25
      - analysis:
          templates:
            - templateName: sentinel-iot-backend-health
      - setWeight: 50
      - pause:
          duration: 2m
      - setWeight: 100

# ── KEDA — Kafka-lag-based autoscaling (replaces HPA when enabled) ────────────
keda:
  enabled: false
  minReplicaCount: 2
  maxReplicaCount: 20
  # Scale 1 replica per N lagging messages across all partitions
  lagThreshold: "1000"
  activationLagThreshold: "100"   # start scaling from 0 only after this lag
  kafkaTopic: telemetry.raw
  consumerGroup: sentinel-telemetry-ingest

# ── Velero — cluster-state backup ─────────────────────────────────────────────
velero:
  enabled: false
  schedule: "0 2 * * *"   # 2 am UTC daily
  ttl: 720h                # 30-day retention
  storageLocation: default

# ── Backup — logical pg_dump to S3 ────────────────────────────────────────────
backup:
  enabled: false
  schedule: "0 3 * * *"   # 3 am UTC daily (1 h after Velero)
  s3Bucket: ""
  s3Region: ap-southeast-1
  image: postgres:16-alpine

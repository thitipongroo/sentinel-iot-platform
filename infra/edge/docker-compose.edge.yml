version: '3.8'

services:
  # ── Store-and-Forward Edge MQTT Broker ──────────────────────────────────────
  mosquitto-edge:
    image: eclipse-mosquitto:2.0.18
    container_name: sentinel-edge-broker
    restart: unless-stopped
    ports:
      - "1883:1883" # Local factory LAN telemetry listener
    volumes:
      - ./mosquitto-edge.conf:/mosquitto/config/mosquitto.conf:ro
      - edge-broker-data:/mosquitto/data
      - ./certs:/mosquitto/config/certs:ro
    environment:
      - GATEWAY_ID=${GATEWAY_ID:-bkk-plant-01}
      - GATEWAY_MQTT_USERNAME=${GATEWAY_MQTT_USERNAME}
      - GATEWAY_MQTT_PASSWORD=${GATEWAY_MQTT_PASSWORD}
    healthcheck:
      test: ["CMD-SHELL", "mosquitto_sub -t '$$SYS/#' -C 1 -i healthcheck || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 3
    logging:
      driver: "json-file"
      options:
        max-size: "50m"
        max-file: "3"

volumes:
  edge-broker-data:
    name: sentinel-edge-broker-data

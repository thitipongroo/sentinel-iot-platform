# ==============================================================================
# Sentinel IoT Platform - Edge Broker Configuration (Store-and-Forward)
# ==============================================================================
# Deployed on factory premises / industrial IPCs (e.g. Advantech, Siemens IPC)
# Provides sub-millisecond local LAN messaging with durable offline queuing.

# ── Local LAN Listener ────────────────────────────────────────────────────────
listener 1883 0.0.0.0
allow_anonymous true

# ── Durable On-Disk Persistence (Store-and-Forward) ───────────────────────────
persistence true
persistence_location /mosquitto/data/
persistence_file mosquitto.db
autosave_interval 300
autosave_on_changes false

# ── Queue Limits for Offline WAN Disconnection ───────────────────────────────
# Buffer up to 500,000 QoS 1/2 messages (approx 256MB) while LTE/WAN link is down
max_queued_messages 500000
max_queued_bytes 268435456
max_inflight_messages 20

# ── Cloud Bridge Connection (Uplink to Sentinel IoT EMQX/Mosquitto) ───────────
connection cloud-sentinel-bridge
address cloud.sentinel.io:8883

# WAN link stability & automatic reconnection
start_type automatic
restart_timeout 5 60
round_robin false
keepalive_interval 30

# Bridge session durability: cleansession false ensures cloud buffers pending msgs
cleansession false
clientid edge-gateway-${GATEWAY_ID}

# Authentication to Cloud Broker
remote_username ${GATEWAY_MQTT_USERNAME}
remote_password ${GATEWAY_MQTT_PASSWORD}

# TLS Encryption
bridge_insecure false
bridge_cafile /mosquitto/config/certs/ca.crt

# ── Topic Mapping & Ingress / Egress Rules ────────────────────────────────────
# Telemetry: Push from local factory devices to Cloud (QoS 1)
topic tenants/+/telemetry out 1 "" ""
topic tenants/+/devices/+/telemetry out 1 "" ""

# Device Twin / Shadow:
# 1. Device reports state -> forward upstream to Cloud
topic tenants/+/devices/+/shadow/update out 1 "" ""
topic tenants/+/devices/+/shadow/get out 1 "" ""

# 2. Cloud shadow responses and delta events -> deliver downstream to Edge devices
topic tenants/+/devices/+/shadow/update/delta in 1 "" ""
topic tenants/+/devices/+/shadow/update/accepted in 1 "" ""
topic tenants/+/devices/+/shadow/update/rejected in 1 "" ""
topic tenants/+/devices/+/shadow/get/accepted in 1 "" ""
topic tenants/+/devices/+/shadow/get/rejected in 1 "" ""

# ── Logging ───────────────────────────────────────────────────────────────────
log_dest stdout
log_type error
log_type warning
log_type notice
log_type information
connection_messages true
log_timestamp true

# ── Environment Promotion Policy ─────────────────────────────────────────────
#
# Owner: Platform/Infra team (Terraform owns infra; ArgoCD owns app sync — see README)
#
# Promotion flow:
#   staging (auto-sync from main)  →  production (manual sync gate, ADMIN approval)
#
# This file is the PRODUCTION ArgoCD Application.
# For staging, use infra/argocd/application-staging.yaml (targetRevision: main, automated sync).
#
# Drift prevention:
#   - selfHeal: true  — ArgoCD reverts manual kubectl changes within 3 minutes
#   - prune: true     — removes resources deleted from Git
#   - ApplyOutOfSyncOnly — avoids touching already-synced resources
#
# Tool ownership:
#   Terraform → manages EKS cluster, RDS, ElastiCache, MSK (cloud infra)
#   Helm      → templates Kubernetes manifests (app config)
#   ArgoCD    → syncs Helm releases from Git to the cluster (GitOps)
# ─────────────────────────────────────────────────────────────────────────────
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: sentinel-iot-production
  namespace: argocd
  annotations:
    # Semantic version tag required for production sync — prevents deploying HEAD directly.
    # Set to the release tag (e.g. "v1.2.0") before approving a production sync.
    argocd.argoproj.io/target-revision-note: "Must be a release tag, not HEAD or main"
  finalizers:
    - resources-finalizer.argocd.argoproj.io
spec:
  project: sentinel-production
  source:
    repoURL: https://github.com/yourorg/sentinel-iot-platform.git
    # PRODUCTION: pin to a semantic version tag, never HEAD.
    # Update this to the target release tag before syncing.
    targetRevision: "v1.0.0"
    path: infra/helm/sentinel-iot
    helm:
      valueFiles:
        - values.yaml
        - values-prod.yaml
  destination:
    server: https://kubernetes.default.svc
    namespace: sentinel
  syncPolicy:
    # Production: manual sync gate — no automated sync.
    # Approve in ArgoCD UI or via: argocd app sync sentinel-iot-production
    automated: null
    syncOptions:
      - CreateNamespace=true
      - PrunePropagationPolicy=foreground
      - ApplyOutOfSyncOnly=true
      - ServerSideApply=true
    retry:
      limit: 5
      backoff:
        duration: 10s
        factor: 2
        maxDuration: 3m
  revisionHistoryLimit: 10   # keep 10 rollback points for production

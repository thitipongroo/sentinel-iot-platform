apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: sentinel-iot-staging
  namespace: argocd
  finalizers:
    - resources-finalizer.argocd.argoproj.io
spec:
  project: sentinel-staging
  source:
    repoURL: https://github.com/yourorg/sentinel-iot-platform.git
    # Staging auto-syncs from main branch — every merge triggers a deploy.
    targetRevision: main
    path: infra/helm/sentinel-iot
    helm:
      valueFiles:
        - values.yaml
  destination:
    server: https://kubernetes.default.svc
    namespace: sentinel-staging
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
      allowEmpty: false
    syncOptions:
      - CreateNamespace=true
      - PrunePropagationPolicy=foreground
      - ApplyOutOfSyncOnly=true
    retry:
      limit: 3
      backoff:
        duration: 10s
        factor: 2
        maxDuration: 2m
  revisionHistoryLimit: 5

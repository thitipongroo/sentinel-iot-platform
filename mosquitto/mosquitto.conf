listener 1883
listener 9001
protocol websockets

# Authentication: password file provisioned at startup by docker-entrypoint.sh.
# Credentials come from MQTT_USER/MQTT_PASS and MQTT_DEVICE_USER/MQTT_DEVICE_PASS env vars.
# TLS listener on port 8883 is auto-appended by the entrypoint when certs exist.
allow_anonymous false
password_file /mosquitto/config/passwd

# Per-user topic ACL — rules are defined per username (requires password_file).
acl_file /mosquitto/config/acl

persistence true
persistence_location /mosquitto/data/
log_type error
log_type warning
log_type notice
log_type information

listener 1883
listener 9001
protocol websockets

# Anonymous access is enabled for development convenience.
# Production hardening: set allow_anonymous false and provision a password_file
# generated via `mosquitto_passwd -c /mosquitto/config/passwd <username>`.
# Set MQTT_USER / MQTT_PASS in docker-compose environment for the backend client.
allow_anonymous true

# Topic-level ACL applies even with anonymous access.
# Clients may only pub/sub to the declared telemetry topics.
acl_file /mosquitto/config/acl

persistence true
persistence_location /mosquitto/data/
log_type all

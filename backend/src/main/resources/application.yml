spring:
  datasource:
    url: jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_NAME:sentinel}
    username: ${DB_USER:sentinel}
    password: ${DB_PASSWORD:sentinel}
    hikari:
      maximum-pool-size: 10
  jpa:
    hibernate:
      ddl-auto: update
    show-sql: false
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}
      password: ${REDIS_PASSWORD:}
      timeout: 2000ms
      lettuce:
        pool:
          max-active: 8
          max-idle: 4

mqtt:
  broker: ${MQTT_BROKER:tcp://localhost:1883}
  client-id: sentinel-backend
  topic: factory/telemetry
  username: ${MQTT_USER:}
  password: ${MQTT_PASS:}

jwt:
  secret: ${JWT_SECRET:sentinelSuperSecretKeyForJWTSigningPurpose2024}
  expiration-ms: 86400000  # 24h

notification:
  line:
    token: ${LINE_NOTIFY_TOKEN:}
    enabled: ${LINE_NOTIFY_ENABLED:false}

alert:
  temperature-threshold: ${TEMP_THRESHOLD:80.0}
  humidity-threshold: ${HUMIDITY_THRESHOLD:90.0}

management:
  endpoints:
    web:
      exposure:
        include: health,info,prometheus,metrics
  metrics:
    export:
      prometheus:
        enabled: true
  endpoint:
    health:
      show-details: always

server:
  port: ${PORT:8080}

logging:
  level:
    com.sentinel: INFO
    org.springframework.security: WARN

spring:
  datasource:
    url: jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_NAME:sentinel}
    username: ${DB_USER:sentinel}
    password: ${DB_PASSWORD:sentinel}
    hikari:
      maximum-pool-size: 10
  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: false
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
  flyway:
    enabled: true
    locations: classpath:db/migration
    baseline-on-migrate: false
  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}
      password: ${REDIS_PASSWORD:}
      timeout: 2000ms
      lettuce:
        pool:
          max-active: 8
          max-idle: 4

mqtt:
  broker: ${MQTT_BROKER:tcp://localhost:1883}
  client-id: sentinel-backend
  topic: factory/telemetry
  username: ${MQTT_USER:}
  password: ${MQTT_PASS:}

jwt:
  secret: ${JWT_SECRET}
  expiration-ms: 900000         # 15 minutes
  refresh-expiration-ms: 604800000  # 7 days

notification:
  line:
    token: ${LINE_NOTIFY_TOKEN:}
    enabled: ${LINE_NOTIFY_ENABLED:false}

alert:
  temperature-threshold: ${TEMP_THRESHOLD:80.0}
  humidity-threshold: ${HUMIDITY_THRESHOLD:90.0}
  smoke-threshold: ${SMOKE_THRESHOLD:200.0}

management:
  endpoints:
    web:
      exposure:
        include: health,info,prometheus,metrics
  metrics:
    export:
      prometheus:
        enabled: true
  endpoint:
    health:
      show-details: always
  tracing:
    sampling:
      probability: 1.0
  otlp:
    tracing:
      endpoint: ${OTEL_EXPORTER_OTLP_ENDPOINT:http://localhost:4318/v1/traces}

server:
  port: ${PORT:8080}

springdoc:
  api-docs:
    path: /api-docs
  swagger-ui:
    path: /swagger-ui.html
    operations-sorter: alpha

resilience4j:
  retry:
    instances:
      telemetryDB:
        max-attempts: 3
        wait-duration: 500ms
        retry-exceptions:
          - org.springframework.dao.DataAccessException
          - org.springframework.dao.TransientDataAccessException
  circuitbreaker:
    instances:
      telemetryDB:
        sliding-window-size: 10
        failure-rate-threshold: 50
        wait-duration-in-open-state: 30s
        permitted-number-of-calls-in-half-open-state: 3
        register-health-indicator: true

spring:
  application:
    name: ${SPRING_APPLICATION_NAME:sentinel-iot-platform}
  datasource:
    url: jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_NAME:sentinel}
    username: ${DB_USER:sentinel}
    password: ${DB_PASSWORD:sentinel}
    hikari:
      maximum-pool-size: 20               # bumped: Kafka consumer batch commits can be concurrent
  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: false
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
        jdbc.batch_size: 50               # JDBC batching: N individual INSERTs → ceil(N/50) batch statements
        order_inserts: true               # required for batching to be effective
        order_updates: true
  kafka:
    bootstrap-servers: ${KAFKA_BOOTSTRAP_SERVERS:localhost:9092}
    producer:
      key-serializer: org.apache.kafka.common.serialization.StringSerializer
      value-serializer: org.apache.kafka.common.serialization.StringSerializer
      acks: 1                             # leader ack — balances durability vs. latency
      compression-type: lz4
      linger-ms: 5                        # micro-batching on producer side
      batch-size: 32768                   # 32 KB producer batch
    consumer:
      group-id: sentinel-telemetry-ingest
      key-deserializer: org.apache.kafka.common.serialization.StringDeserializer
      value-deserializer: org.apache.kafka.common.serialization.StringDeserializer
      auto-offset-reset: earliest
      enable-auto-commit: false           # manual offset commit via AckMode.BATCH
      max-poll-records: 500
  flyway:
    enabled: true
    locations: classpath:db/migration
    baseline-on-migrate: false
  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}
      password: ${REDIS_PASSWORD:}
      timeout: 2000ms
      lettuce:
        pool:
          max-active: 8
          max-idle: 4

kafka:
  topics:
    telemetry-raw: telemetry.raw

mqtt:
  broker: ${MQTT_BROKER:tcp://localhost:1883}
  client-id: sentinel-backend
  topic: factory/telemetry
  dlq-topic: factory/telemetry/dlq
  username: ${MQTT_USER:}
  password: ${MQTT_PASS:}

jwt:
  secret: ${JWT_SECRET}
  expiration-ms: 900000         # 15 minutes
  refresh-expiration-ms: 604800000  # 7 days

notification:
  line:
    token: ${LINE_NOTIFY_TOKEN:}
    enabled: ${LINE_NOTIFY_ENABLED:false}

alert:
  temperature-threshold: ${TEMP_THRESHOLD:80.0}
  humidity-threshold: ${HUMIDITY_THRESHOLD:90.0}
  smoke-threshold: ${SMOKE_THRESHOLD:200.0}

audit:
  retention-days: ${AUDIT_RETENTION_DAYS:90}
  cron: "0 30 3 * * *"

telemetry:
  retention-days: ${TELEMETRY_RETENTION_DAYS:30}
  retention:
    cron: "0 30 2 * * *"
  replay:
    interval-ms: ${TELEMETRY_REPLAY_INTERVAL_MS:30000}
    batch-size: ${TELEMETRY_REPLAY_BATCH_SIZE:100}
    max-queue-size: ${TELEMETRY_REPLAY_MAX_QUEUE:10000}

management:
  endpoints:
    web:
      exposure:
        include: health,info,prometheus,metrics
  metrics:
    export:
      prometheus:
        enabled: true
  endpoint:
    health:
      show-details: when-authorized
  tracing:
    sampling:
      probability: 1.0
    # Propagates traceId + spanId into MDC so every log line is correlated with its trace
    enabled: true
  otlp:
    tracing:
      endpoint: ${OTEL_EXPORTER_OTLP_ENDPOINT:http://localhost:4318/v1/traces}

cors:
  allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:3000}

server:
  port: ${PORT:8080}

springdoc:
  api-docs:
    path: /api-docs
  swagger-ui:
    path: /swagger-ui.html
    operations-sorter: alpha

resilience4j:
  retry:
    instances:
      telemetryDB:
        max-attempts: 3
        wait-duration: 500ms
        retry-exceptions:
          - org.springframework.dao.DataAccessException
          - org.springframework.dao.TransientDataAccessException
  circuitbreaker:
    instances:
      telemetryDB:
        sliding-window-size: 10
        failure-rate-threshold: 50
        wait-duration-in-open-state: 30s
        permitted-number-of-calls-in-half-open-state: 3
        register-health-indicator: true

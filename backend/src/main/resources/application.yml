spring:
  application:
    name: ${SPRING_APPLICATION_NAME:sentinel-iot-platform}
  datasource:
    url: jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_NAME:sentinel}
    username: ${DB_USER:sentinel}
    password: ${DB_PASSWORD:sentinel}
    hikari:
      maximum-pool-size: 20               # bumped: Kafka consumer batch commits can be concurrent
  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: false
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
        jdbc.batch_size: 50               # JDBC batching: N individual INSERTs → ceil(N/50) batch statements
        order_inserts: true               # required for batching to be effective
        order_updates: true
  kafka:
    bootstrap-servers: ${KAFKA_BOOTSTRAP_SERVERS:localhost:9092}
    producer:
      key-serializer: org.apache.kafka.common.serialization.StringSerializer
      value-serializer: org.apache.kafka.common.serialization.StringSerializer
      acks: 1                             # leader ack — balances durability vs. latency
      compression-type: lz4
      linger-ms: 5                        # micro-batching on producer side
      batch-size: 32768                   # 32 KB producer batch
    consumer:
      group-id: sentinel-telemetry-ingest
      key-deserializer: org.apache.kafka.common.serialization.StringDeserializer
      value-deserializer: org.apache.kafka.common.serialization.StringDeserializer
      auto-offset-reset: earliest
      enable-auto-commit: false           # manual offset commit via AckMode.BATCH
      max-poll-records: 500
  flyway:
    enabled: true
    locations: classpath:db/migration
    baseline-on-migrate: false
  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}
      password: ${REDIS_PASSWORD:}
      timeout: 2000ms
      lettuce:
        pool:
          max-active: 8
          max-idle: 4

# Redis namespace isolation (see RedisConfig.java).
# DB-0: telemetry cache + replay queue (default StringRedisTemplate)
# DB-1: JWT token blocklist (authRedisTemplate — security-critical, isolated)
# Production: point redis.auth.* at a separate Redis instance for full isolation.
redis:
  auth:
    host: ${REDIS_AUTH_HOST:${REDIS_HOST:localhost}}
    port: ${REDIS_AUTH_PORT:${REDIS_PORT:6379}}

kafka:
  topics:
    telemetry-raw: telemetry.raw
    telemetry-dlq: telemetry.dlq   # durable fallback; 7-day retention configured in KafkaConfig

mqtt:
  broker: ${MQTT_BROKER:tcp://localhost:1883}
  client-id: sentinel-backend
  topic: factory/telemetry
  dlq-topic: factory/telemetry/dlq
  username: ${MQTT_USER:}
  password: ${MQTT_PASS:}

jwt:
  secret: ${JWT_SECRET}
  # Zero-downtime key rotation: set JWT_PREVIOUS_SECRET=<old-secret> while deploying new JWT_SECRET.
  # Tokens signed with the previous key remain valid until they expire (15 min), then clear this.
  previous-secret: ${JWT_PREVIOUS_SECRET:}
  expiration-ms: 900000         # 15 minutes
  refresh-expiration-ms: 604800000  # 7 days
  # Redis key prefix for the access-token revocation blocklist (JTI-based, TTL = token remaining lifetime).
  revocation-key-prefix: "jwt:revoked:"

init:
  admin:
    password: ${INIT_ADMIN_PASSWORD:}
  operator:
    password: ${INIT_OPERATOR_PASSWORD:}

notification:
  dedup:
    enabled: ${NOTIFY_DEDUP_ENABLED:true}
    cooldown-minutes: ${NOTIFY_DEDUP_COOLDOWN_MINUTES:5}
  line-messaging:
    channel-token: ${LINE_MESSAGING_CHANNEL_TOKEN:}
    to: ${LINE_MESSAGING_TO:}
    enabled: ${LINE_MESSAGING_ENABLED:false}
  telegram:
    bot-token: ${TELEGRAM_BOT_TOKEN:}
    chat-id: ${TELEGRAM_CHAT_ID:}
    enabled: ${TELEGRAM_ENABLED:false}
  apprise:
    url: ${APPRISE_URL:}
    tag: ${APPRISE_TAG:}
    enabled: ${APPRISE_ENABLED:false}
  slack:
    webhook-url: ${SLACK_WEBHOOK_URL:}
    enabled: ${SLACK_NOTIFY_ENABLED:false}
  webhook:
    url: ${NOTIFY_WEBHOOK_URL:}
    enabled: ${NOTIFY_WEBHOOK_ENABLED:false}
    secret: ${NOTIFY_WEBHOOK_SECRET:}

alert:
  temperature-threshold: ${TEMP_THRESHOLD:80.0}
  humidity-threshold: ${HUMIDITY_THRESHOLD:90.0}
  smoke-threshold: ${SMOKE_THRESHOLD:200.0}

audit:
  retention-days: ${AUDIT_RETENTION_DAYS:90}
  cron: "0 30 3 * * *"

ingestion:
  max-concurrent-messages: ${INGESTION_MAX_CONCURRENT:200}

metrics:
  business:
    refresh-interval-ms: ${METRICS_BUSINESS_REFRESH_MS:30000}

telemetry:
  retention-days: ${TELEMETRY_RETENTION_DAYS:30}
  late-arrival:
    lookback-days: ${TELEMETRY_LATE_ARRIVAL_LOOKBACK_DAYS:2}
  retention:
    cron: "0 30 2 * * *"
  replay:
    interval-ms: ${TELEMETRY_REPLAY_INTERVAL_MS:30000}
    batch-size: ${TELEMETRY_REPLAY_BATCH_SIZE:100}
    max-queue-size: ${TELEMETRY_REPLAY_MAX_QUEUE:10000}

management:
  endpoints:
    web:
      exposure:
        include: health,info,prometheus,metrics
  metrics:
    export:
      prometheus:
        enabled: true
  endpoint:
    health:
      show-details: when-authorized
      probes:
        enabled: true
  health:
    livenessstate:
      enabled: true
    readinessstate:
      enabled: true
  tracing:
    sampling:
      probability: 1.0
    # Propagates traceId + spanId into MDC so every log line is correlated with its trace.
    # Disabled by default; set TRACING_ENABLED=true when running with --profile observability.
    enabled: ${TRACING_ENABLED:false}
  otlp:
    tracing:
      endpoint: ${OTEL_EXPORTER_OTLP_ENDPOINT:http://localhost:4318/v1/traces}

schema-registry:
  url: ${SCHEMA_REGISTRY_URL:http://localhost:8081}
  enabled: ${SCHEMA_REGISTRY_ENABLED:false}  # enable in staging/prod where Confluent Platform is available

cors:
  allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:3000}

ws:
  broadcast:
    channel: ${WS_BROADCAST_CHANNEL:ws:telemetry}   # Redis pub/sub channel for cross-instance WebSocket broadcast

server:
  port: ${PORT:8080}

springdoc:
  api-docs:
    path: /api-docs
  swagger-ui:
    path: /swagger
    operations-sorter: alpha

resilience4j:
  retry:
    instances:
      telemetryDB:
        max-attempts: 3
        wait-duration: 500ms
        retry-exceptions:
          - org.springframework.dao.DataAccessException
          - org.springframework.dao.TransientDataAccessException
  circuitbreaker:
    instances:
      telemetryDB:
        sliding-window-size: 10
        failure-rate-threshold: 50
        wait-duration-in-open-state: 30s
        permitted-number-of-calls-in-half-open-state: 3
        register-health-indicator: true

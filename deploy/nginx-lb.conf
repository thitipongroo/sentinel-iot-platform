# nginx load balancer configuration for a horizontally scaled Sentinel IoT deployment.
#
# WebSocket scaling strategy:
#   - Redis pub/sub (ws:telemetry channel) syncs broadcasts across all backend instances.
#     Any instance that processes a Kafka batch publishes to Redis; every instance fans
#     the message out to its own local WebSocket sessions.
#   - ip_hash provides sticky sessions at the LB level. This ensures:
#       1. WebSocket upgrade + subsequent frames always reach the same backend instance.
#       2. Reconnecting clients land on the same instance that last held their session,
#          avoiding a "cold" reconnect that would miss events already broadcast to the
#          previous connection before Redis sync catches up.
#   - API requests (/api/*) can use round-robin — they are stateless (JWT-authenticated).

upstream sentinel_backend {
    ip_hash;                    # sticky sessions — required for WebSocket connections
    server backend-1:8080;
    server backend-2:8080;
    server backend-3:8080;
    keepalive 64;               # reuse upstream connections for API traffic
}

server {
    listen 80;
    server_name _;

    # ── WebSocket endpoint ────────────────────────────────────────────────────
    location /ws/ {
        proxy_pass         http://sentinel_backend;
        proxy_http_version 1.1;
        proxy_set_header   Upgrade    $http_upgrade;
        proxy_set_header   Connection "upgrade";
        proxy_set_header   Host       $host;
        proxy_set_header   X-Real-IP  $remote_addr;
        proxy_read_timeout 86400s;   # 24 h — WebSocket connections are long-lived
        proxy_send_timeout 86400s;
    }

    # ── REST API ──────────────────────────────────────────────────────────────
    location /api/ {
        proxy_pass         http://sentinel_backend;
        proxy_http_version 1.1;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
        proxy_set_header   Connection        "";   # disable keepalive header for upstream reuse
    }

    # ── Health / actuator ─────────────────────────────────────────────────────
    # Expose only the health endpoint publicly; prometheus scrapes directly from
    # each backend instance, not through the LB.
    location /actuator/health {
        proxy_pass http://sentinel_backend;
        proxy_set_header Host $host;
    }
}

name: CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main]

jobs:
  backend:
    name: Backend — Build & Test
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: maven

      - name: Lint (Checkstyle)
        working-directory: backend
        run: mvn checkstyle:check -q

      - name: Build
        working-directory: backend
        run: mvn compile -q

      - name: Unit tests
        working-directory: backend
        env:
          JWT_SECRET: ci-test-secret-key-32-chars-minimum!
        run: mvn test -pl . -Dtest="*Test" -q

      - name: Integration tests
        working-directory: backend
        env:
          JWT_SECRET: ci-test-secret-key-32-chars-minimum!
        run: mvn verify -pl . -Dtest="*IntegrationTest" -q

      - name: Upload test report
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: backend-test-report
          path: backend/target/surefire-reports/

  frontend:
    name: Frontend — Build & Lint
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up Node 20
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        working-directory: frontend
        run: npm ci

      - name: Lint
        working-directory: frontend
        run: npm run lint

      - name: Build
        working-directory: frontend
        run: npm run build

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: frontend-dist
          path: |
            frontend/.next/standalone/
            frontend/.next/static/

  docker:
    name: Docker — Compose Validation
    runs-on: ubuntu-latest
    needs: [backend, frontend]

    steps:
      - uses: actions/checkout@v4

      - name: Validate docker-compose
        run: docker compose config --quiet

      - name: Build images
        run: docker compose build --parallel
        env:
          DOCKER_BUILDKIT: "1"
          JWT_SECRET: ci-test-secret-placeholder

  helm-lint:
    name: Helm — Lint Chart
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Install Helm
        uses: azure/setup-helm@v4
        with:
          version: v3.15.2

      - name: Lint default values
        run: helm lint infra/helm/sentinel-iot

      - name: Lint prod values
        run: helm lint infra/helm/sentinel-iot -f infra/helm/sentinel-iot/values-prod.yaml

      - name: Template render (default)
        run: helm template sentinel-iot infra/helm/sentinel-iot --debug > /dev/null

      - name: Template render (prod)
        run: |
          helm template sentinel-iot infra/helm/sentinel-iot \
            -f infra/helm/sentinel-iot/values-prod.yaml \
            --debug > /dev/null

  image-publish:
    name: Publish — Container Images to GHCR
    runs-on: ubuntu-latest
    needs: [backend, frontend, docker, helm-lint]
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    permissions:
      contents: read
      packages: write

    steps:
      - uses: actions/checkout@v4

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Extract image metadata (backend)
        id: meta-backend
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository_owner }}/sentinel-backend
          tags: |
            type=sha,prefix=,format=short
            type=raw,value=latest

      - name: Build and push backend image
        uses: docker/build-push-action@v5
        with:
          context: backend
          push: true
          tags: ${{ steps.meta-backend.outputs.tags }}
          labels: ${{ steps.meta-backend.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Extract image metadata (frontend)
        id: meta-frontend
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository_owner }}/sentinel-frontend
          tags: |
            type=sha,prefix=,format=short
            type=raw,value=latest

      - name: Build and push frontend image
        uses: docker/build-push-action@v5
        with:
          context: frontend
          push: true
          tags: ${{ steps.meta-frontend.outputs.tags }}
          labels: ${{ steps.meta-frontend.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
